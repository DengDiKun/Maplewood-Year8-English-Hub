name: One-time reading practice hub link

on:
  push:
    paths:
      - '.github/workflows/one-time-reading-practice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reading practice link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="hero-actions"><a class="cta primary" href="#journey">Explore the curriculum →</a><a class="cta secondary" href="unit8-3.html">Continue Unit 8.3 🧠</a><a class="cta secondary" href="speaking-assessment.html">Research Showcase 🎤</a></div>'
          new='<div class="hero-actions"><a class="cta primary" href="#journey">Explore the curriculum →</a><a class="cta secondary" href="unit8-3.html">Continue Unit 8.3 🧠</a><a class="cta secondary" href="reading-exam-practice.html">Reading Exam Practice 📝</a><a class="cta secondary" href="speaking-assessment.html">Research Showcase 🎤</a></div>'
          if 'href="reading-exam-practice.html"' not in s:
              if old not in s:
                  raise SystemExit('Hero action block not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-reading-practice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-reading-practice.yml
          git commit -m "Add reading exam practice to Learning Hub"
          git push
