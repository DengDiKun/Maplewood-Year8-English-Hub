name: Firebase access checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'earlier-hub.html'
      - 'home-entry.mjs'
      - 'merchant-*.mjs'
      - 'unit8-1-core.html'
      - 'admin-*.mjs'
      - 'admin-login.html'
      - 'teacher-login.*'
      - 'student-roster.mjs'
      - 'activity-responses.mjs'
      - 'learning-*.mjs'
      - 'learning-units.css'
      - 'unit-course.html'
      - 'marking-*.mjs'
      - 'marking.css'
      - 'student-login.*'
      - 'student-access.mjs'
      - 'scripts/provision_students.py'
      - 'firestore.rules'
      - 'firebase.emulators.json'
      - 'package*.json'
      - 'tests/**'
      - '.github/workflows/firebase-access-checks.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'earlier-hub.html'
      - 'home-entry.mjs'
      - 'merchant-*.mjs'
      - 'unit8-1-core.html'
      - 'admin-*.mjs'
      - 'admin-login.html'
      - 'teacher-login.*'
      - 'student-roster.mjs'
      - 'activity-responses.mjs'
      - 'learning-*.mjs'
      - 'learning-units.css'
      - 'unit-course.html'
      - 'marking-*.mjs'
      - 'marking.css'
      - 'student-login.*'
      - 'student-access.mjs'
      - 'scripts/provision_students.py'
      - 'firestore.rules'
      - 'firebase.emulators.json'
      - 'package*.json'
      - 'tests/**'
      - '.github/workflows/firebase-access-checks.yml'

permissions:
  contents: read

jobs:
  access-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check admin-login.mjs
      - run: node --check teacher-login.mjs
      - run: node --check student-roster.mjs
      - run: npm run test:rules
      - run: npm run test:auth
      - run: node --check student-login.mjs
      - run: node --check activity-responses.mjs
      - run: python3 -m unittest discover -s tests -p "test_provision_students.py"
      - run: npm run test:student
      - run: node --check marking-data.mjs
      - run: node --check marking-ui.mjs
      - run: npm run test:marking
      - run: node --check learning-catalogue.mjs
      - run: node --check learning-units.mjs
      - run: npm run test:units
      - run: node --check home-entry.mjs
      - run: node --check merchant-lesson.mjs
      - run: npm run test:merchant
