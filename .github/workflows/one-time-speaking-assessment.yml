name: One-time speaking assessment integration

on:
  push:
    paths:
      - '.github/workflows/one-time-speaking-assessment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 one-time-speaking-patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apps-script-learning-hub.gs
          git commit -m "Integrate speaking assessment topic reservation system" || exit 0
          git push
