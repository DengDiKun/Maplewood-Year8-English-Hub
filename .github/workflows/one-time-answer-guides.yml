name: One-time answer guide patch

on:
  push:
    paths:
      - '.github/workflows/one-time-answer-guides.yml'

permissions:
  contents: write

jobs:
  patch-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add answer guides and worked examples
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          guide_box = 'margin:16px 0 20px;padding:16px 18px;border-radius:20px;background:#eef8f7;border:1px solid rgba(18,67,88,.14);line-height:1.55'
          example_box = 'margin-top:12px;padding:12px 14px;border-radius:15px;background:#fff8e7;border-left:4px solid #d8a43a;line-height:1.55'

          # ---------- Unit 8.2 ----------
          p = Path('unit8-2.html')
          s = p.read_text(encoding='utf-8')

          if 'HOW TO ANSWER • Activity 2' not in s:
              g2 = f'''<details style="{guide_box}"><summary style="cursor:pointer;font-weight:900;color:#0b2f47">🧭 HOW TO ANSWER • Activity 2</summary><div style="padding-top:12px"><ol><li><b>Read the quotation slowly.</b> Look for a word or action that shows a feeling.</li><li><b>Name the feeling.</b> For example: hesitation, confidence, worry or regret.</li><li><b>Explain the clue.</b> Say which word or phrase gave you that idea.</li><li><b>Connect it to choices.</b> Explain what the feeling shows about making an important decision.</li></ol><div style="{example_box}"><b>Example using a different situation:</b><br>“Maya stopped at the doorway and looked back twice.”<br><b>Possible response:</b> Maya seems hesitant because she stops and looks back before moving on. This suggests that her decision is important and she is not completely certain about it.</div></div></details>'''
              pattern = r'(<section class="section" id="activity2">.*?<div class="instruction">.*?</div>)(<div class="quote-grid">)'
              s, n = re.subn(pattern, lambda m: m.group(1)+g2+m.group(2), s, count=1, flags=re.S)
              assert n == 1, 'Could not insert Unit 8.2 Activity 2 guide'

          if 'HOW TO ANSWER • Activity 3' not in s:
              g3 = f'''<details style="{guide_box}"><summary style="cursor:pointer;font-weight:900;color:#0b2f47">🧭 HOW TO ANSWER • Activity 3</summary><div style="padding-top:12px"><p><b>For your notes:</b> deal with one comparison point at a time. Find evidence from both texts before you begin writing.</p><p><b>For each comparison paragraph, use this order:</b></p><ol><li>Make one clear comparison point.</li><li>Use a short quotation from Text 1.</li><li>Explain what the quotation shows.</li><li>Use <b>similarly</b>, <b>however</b>, <b>whereas</b> or <b>in contrast</b>.</li><li>Use evidence from Text 2 and explain it.</li><li>Finish by stating the important similarity or difference.</li></ol><div style="{example_box}"><b>Worked example using different mini-texts:</b><br>Text A says, “I waited beside the gate,” while Text B says, “She ran towards the train.” A comparison could begin: <i>Both characters face an important moment, but they react differently. The verb “waited” suggests uncertainty in Text A. In contrast, “ran” makes the character in Text B seem more certain and decisive.</i></div></div></details>'''
              pattern = r'(<section class="section alt" id="activity3">.*?<div class="instruction">.*?</div>)(<div class="note-table">)'
              s, n = re.subn(pattern, lambda m: m.group(1)+g3+m.group(2), s, count=1, flags=re.S)
              assert n == 1, 'Could not insert Unit 8.2 Activity 3 guide'

          review82 = '''<section class="section alt" id="submitSection"><div class="submit-card"><div class="eyebrow">Finish the lesson</div><h3>Submit before you see the answer guide & examples</h3><p>Students must complete Activities 2 and 3 and submit their work first. After submission, a guide and worked examples will unlock. They show <b>how</b> to build an answer without giving one fixed answer to copy. Teacher mode can preview them without submitting.</p><button class="submit-btn" id="submitWork">Submit to Teacher & Unlock Guide →</button><button class="review-btn" id="teacherReview" style="display:none;background:linear-gradient(135deg,#8b671c,#d8a43a)">Teacher: Preview guide & examples →</button><div class="submit-status" id="submitStatus"></div><div class="review" id="review"><div class="eyebrow">Post-submission learning guide</div><h3>How to answer + worked examples</h3><p>Use these to check your <b>method</b>. The examples use different situations so you still have to think about the coursebook texts for yourself.</p><div class="review-grid"><div class="review-card"><strong>Activity 2 — Quotation 1: How to answer</strong><div>1. Name the feeling. 2. Identify the word/action that creates it. 3. Explain what that feeling tells us about an important choice.</div><div style="margin-top:10px"><b>Example:</b> “Amin held the form for a long time before signing it.” → Amin seems unsure because he delays before signing. The delay suggests that the decision matters to him.</div><div class="your-answer" id="rA21"></div></div><div class="review-card"><strong>Activity 2 — Quotation 2: How to answer</strong><div>Think about <b>consequences</b>. Ask: Can the character easily undo the choice? What future effect might the character be thinking about?</div><div style="margin-top:10px"><b>Example:</b> “Once I boarded the bus, I knew the old route was behind me.” → The character realises that moving forward may make it difficult to return to the earlier choice.</div><div class="your-answer" id="rA22"></div></div><div class="review-card"><strong>Activity 2 — Quotation 3: How to answer</strong><div>Look at the character <b>after</b> the decision. Decide whether the tone sounds proud, accepting, doubtful or reflective, then explain why.</div><div style="margin-top:10px"><b>Example:</b> “Years later, I still remember choosing the smaller school.” → The speaker is reflecting on a past decision and showing that it remained important.</div><div class="your-answer" id="rA23"></div></div><div class="review-card"><strong>Activity 3 — Building comparison notes</strong><div>For each row, write a short note for Text 1 and a matching note for Text 2. Do not write two unrelated summaries. Your notes should help you answer: <b>How are they similar? How are they different?</b></div><div style="margin-top:10px"><b>Example:</b> Feelings — Text A: nervous before deciding. Text B: confident before deciding. Comparison: both face a choice, but their attitudes differ.</div></div><div class="review-card"><strong>Activity 3 — Using quotations</strong><div>Choose a <b>short</b> quotation that proves your point. Embed it inside your own sentence, then explain one important word.</div><div style="margin-top:10px"><b>Example:</b> The character “paused at the door”, and the verb “paused” suggests hesitation.</div></div><div class="review-card"><strong>Activity 3 — Comparing methods</strong><div>When writing about metaphor, adverbs or structure, name the method and then explain its effect. Avoid simply listing techniques.</div><div style="margin-top:10px"><b>Example:</b> “The exam was a mountain” is a metaphor. It makes the challenge seem large and difficult, showing how serious the decision feels.</div></div></div><div class="model"><strong>Worked comparison example using different texts:</strong><br><br>Both characters face a difficult decision, but they respond in different ways. In Text A, Karim “waited by the gate”, and the verb “waited” suggests that he is uncertain about leaving. In contrast, Text B describes Lena as moving “quickly” towards the station. The adverb “quickly” makes her seem more decisive. Therefore, both texts explore an important choice, but one character hesitates while the other acts with greater confidence.<br><br><b>Notice the pattern:</b> comparison point → evidence → explanation → comparison word → second evidence → explanation.</div></div></div></section>'''
          pattern = r'<section class="section alt" id="submitSection">.*?</section>\s*</div>\s*<footer'
          s, n = re.subn(pattern, review82+'\n</div>\n<footer', s, count=1, flags=re.S)
          assert n == 1, 'Could not replace Unit 8.2 review section'
          s = s.replace('✓ Submitted. Expected answers are now unlocked below.', '✓ Submitted. Your answer guide and worked examples are now unlocked below.')
          p.write_text(s, encoding='utf-8')

          # ---------- Unit 8.3 ----------
          p = Path('unit8-3.html')
          s = p.read_text(encoding='utf-8')

          def insert_after_once(text, needle, addition, label):
              if addition.split('•')[0].strip() in text:
                  return text
              idx = text.find(needle)
              assert idx != -1, f'Could not find {label}'
              idx += len(needle)
              return text[:idx] + addition + text[idx:]

          if 'HOW TO ANSWER • Activity 2' not in s:
              marker = '<div class="mission"><h3>Activity 2 — Discussion lab</h3><p>Choose a role for each group member, then decide which suggestion your group would introduce.</p>'
              g = f'''<details style="{guide_box}"><summary style="cursor:pointer;font-weight:900;color:#0b2f47">🧭 HOW TO ANSWER • Activity 2</summary><div style="padding-top:12px"><ol><li>State which suggestion your group is discussing.</li><li>Give at least one advantage.</li><li>Give at least one disadvantage.</li><li>Listen to another view and respond to it.</li><li>Reach a final decision and explain <b>why</b> your group chose it.</li></ol><div style="{example_box}"><b>Example using a different topic:</b> “School should begin one hour later.” A student could say: <i>A later start may help tired students concentrate, but it could also make the school day finish later. I would support it only if transport and after-school activities could still work.</i></div></div></details>'''
              s = insert_after_once(s, marker, g, 'Unit 8.3 Activity 2 marker')

          if 'HOW TO ANSWER • Activity 3' not in s:
              marker = '<div class="mission"><h3>Activity 3 — Main vs subsidiary points</h3><p>Use the article above. Record the main point and useful supporting information from each paragraph.</p>'
              g = f'''<details style="{guide_box}"><summary style="cursor:pointer;font-weight:900;color:#0b2f47">🧭 HOW TO ANSWER • Activity 3</summary><div style="padding-top:12px"><p><b>Main point</b> = the most important message of the whole paragraph. <b>Subsidiary information</b> = details that support it, such as names, examples, methods, numbers or results.</p><ol><li>Skim the whole paragraph once.</li><li>Ask: “What is this paragraph mainly doing or telling me?”</li><li>Write that as one short main point.</li><li>Scan again and select only the details that support that main point.</li></ol><div style="{example_box}"><b>Example using a different paragraph:</b><br>“The school library introduced a quiet-reading hour last month. Forty students joined during the first week, and teachers reported fewer late returns.”<br><b>Main point:</b> The library introduced a new quiet-reading hour.<br><b>Subsidiary information:</b> It started last month; forty students joined; teachers noticed fewer late returns.</div></div></details>'''
              s = insert_after_once(s, marker, g, 'Unit 8.3 Activity 3 marker')

          if 'HOW TO ANSWER • Activity 4' not in s:
              marker = '<div class="mission"><h3>Activity 4 — Structure detective</h3><p><strong>a</strong> Summarise the function of each paragraph.</p>'
              g = f'''<details style="{guide_box}"><summary style="cursor:pointer;font-weight:900;color:#0b2f47">🧭 HOW TO ANSWER • Activity 4</summary><div style="padding-top:12px"><p><b>Part a — paragraph function:</b> Do not retell every detail. Use a verb that explains the paragraph’s job, such as <i>introduces, explains, describes, reports, contrasts, applies</i> or <i>concludes</i>.</p><p><b>Part b — adverbs:</b> identify the linking/time word, say what relationship it shows, then explain how it helps the reader follow the sequence or contrast.</p><div style="{example_box}"><b>Example:</b> If a paragraph begins “First, the students completed a survey. Afterwards, they discussed the results,” you could explain that <i>“First” and “Afterwards” show the order of events, making the stages easier for the reader to follow.</i></div></div></details>'''
              s = insert_after_once(s, marker, g, 'Unit 8.3 Activity 4 marker')

          if 'HOW TO ANSWER • Activity 5' not in s:
              marker = '<div class="mission writing"><h3>Activity 5 — 150-word account</h3><p>Plan and write your account here. Use time and linking adverbs to organise your writing.</p>'
              g = f'''<details style="{guide_box}"><summary style="cursor:pointer;font-weight:900;color:#0b2f47">🧭 HOW TO ANSWER • Activity 5</summary><div style="padding-top:12px"><ol><li><b>Opening:</b> explain the decision and the choices available.</li><li><b>Middle:</b> describe how you decided. Use sequence words such as <i>first, next, afterwards, however</i>.</li><li><b>Ending:</b> explain what you chose and how you felt afterwards.</li><li>Check that you have answered all three bullet points and are close to 150 words.</li></ol><div style="{example_box}"><b>Example plan:</b><br>Decision: art club or football training.<br>Choices: join one activity because both happen on the same afternoon.<br>Process: compare what I enjoy, speak to both teachers, think about future competitions.<br>Feeling afterwards: disappointed to miss one activity but satisfied with the final choice.</div></div></details>'''
              s = insert_after_once(s, marker, g, 'Unit 8.3 Activity 5 marker')

          review83 = '''<section class="section alt" id="submitSection"><div class="submit-card"><div class="eyebrow">Finish the lesson</div><h3>Submit before you see the answer guide & examples</h3><p>Students must complete the interactive Activities 2–5 and submit their work first. After submission, a guide and worked examples will unlock. The examples use different situations so students learn the method instead of copying a fixed answer. Teacher mode can preview them without submitting.</p><button class="submit-btn" id="submitWork">Submit to Teacher & Unlock Guide →</button><button class="review-btn" id="teacherReview" style="display:none;background:linear-gradient(135deg,#8b671c,#d8a43a)">Teacher: Preview guide & examples →</button><div class="submit-status" id="submitStatus"></div><div class="review" id="review"><div class="eyebrow">Post-submission learning guide</div><h3>How to answer + worked examples</h3><p>Compare your approach with the method below. These are examples of <b>how to construct an answer</b>, not the answers to the article.</p><div class="review-grid"><div class="review-card"><strong>Activity 2 — Discussion: How to answer</strong><div>Use the pattern: <b>opinion → advantage → disadvantage → response to another view → final reasoned decision</b>. There is no single correct choice.</div><div style="margin-top:10px"><b>Example:</b> “School uniforms should be optional.” A balanced response might explain one benefit, one problem, then give a final position with a reason.</div><div class="your-answer" id="rVote"></div></div><div class="review-card"><strong>Activity 3 — Main vs subsidiary: How to answer</strong><div>Write the paragraph’s big idea in one short sentence. Then list only details that support it. Names, examples, methods and results are usually subsidiary information.</div><div style="margin-top:10px"><b>Example:</b> In a paragraph about a recycling project, “The school launched a recycling programme” could be the main point, while the launch date, number of bins and student participation are supporting details.</div><div class="your-answer" id="rP1"></div></div><div class="review-card"><strong>Activity 3 — Checking your paragraph 2 notes</strong><div>Ask: “If I removed all the details, what single idea would remain?” That idea is probably your main point. Then check whether each subsidiary detail clearly supports it.</div><div style="margin-top:10px"><b>Example:</b> Main point: Researchers tested a new study method. Details: who took part, how long the test lasted and what participants had to do.</div><div class="your-answer" id="rP2"></div></div><div class="review-card"><strong>Activity 3 — Checking your paragraph 3 notes</strong><div>When a paragraph gives results, the main point should summarise the overall finding. Do not copy every result into the main-point box.</div><div style="margin-top:10px"><b>Example:</b> Main point: Students remembered more after using diagrams. Details: the percentage increase and which group improved most.</div><div class="your-answer" id="rP3"></div></div><div class="review-card"><strong>Activity 3 — Checking your paragraph 4 notes</strong><div>For a concluding paragraph, look for wider meaning, recommendation, implication or application. Supporting examples belong in subsidiary information.</div><div style="margin-top:10px"><b>Example:</b> Main point: The research could change how schools teach revision. Detail: the writer suggests using more visual revision tools.</div><div class="your-answer" id="rP4"></div></div><div class="review-card"><strong>Activity 4a — Paragraph functions</strong><div>Start each answer with a precise job verb: <i>introduces, explains, describes, reports, contrasts, applies</i> or <i>concludes</i>. Then add what information is being handled.</div><div style="margin-top:10px"><b>Example:</b> “Paragraph 2 <b>explains</b> how the survey was carried out.” This is stronger than simply retelling the survey details.</div><div class="your-answer" id="rFunctions"></div></div><div class="review-card"><strong>Activity 4b — Linking & time adverbs</strong><div>Use three steps: <b>identify the word → state the relationship → explain the effect on the reader</b>.</div><div style="margin-top:10px"><b>Example:</b> In “First, the class voted. Afterwards, they discussed the result,” the adverbs show sequence and make the stages easy to follow.</div><div class="your-answer" id="rAdverbs"></div></div><div class="review-card"><strong>Activity 5 — Account writing</strong><div>Use a simple three-part shape: <b>choices available → decision process → feelings afterwards</b>. Add time/linking adverbs so the order is clear.</div><div style="margin-top:10px"><b>Useful starters:</b> At first… / First… / Next… / However… / Afterwards… / Eventually… / Looking back…</div></div></div><div class="model"><strong>Worked account example — different situation:</strong><br><br>Last term, I had to decide whether to join the art club or continue football training because both activities took place on the same afternoon. At first, I wanted to choose football because I had already trained with the team for several months. However, I was also interested in learning digital drawing. First, I spoke to both teachers and asked about future competitions. Next, I considered which activity I would regret missing more. Afterwards, I decided to continue football and attend short art workshops during the holidays instead. I felt slightly disappointed because I could not do both activities every week. Eventually, however, I felt satisfied with my decision because I had considered my options carefully. Looking back, I learned that making a good decision sometimes means accepting that every choice has a disadvantage.<br><br><b>Notice:</b> the example answers all three bullet points and uses time/linking adverbs to organise the sequence.</div></div></div></section>'''
          pattern = r'<section class="section alt" id="submitSection">.*?</section>\s*</div>\s*<footer'
          s, n = re.subn(pattern, review83+'\n</div>\n<footer', s, count=1, flags=re.S)
          assert n == 1, 'Could not replace Unit 8.3 review section'
          s = s.replace('✓ Submitted. Expected answers are now unlocked below.', '✓ Submitted. Your answer guide and worked examples are now unlocked below.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched lessons
        shell: bash
        run: |
          git config user.name "Maplewood Learning Hub"
          git config user.email "actions@users.noreply.github.com"
          git add unit8-2.html unit8-3.html
          git diff --cached --quiet && exit 0
          git commit -m "Add answer guides and worked examples to Units 8.2 and 8.3"
          git push
