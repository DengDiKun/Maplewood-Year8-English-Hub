<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 8.1 | Maplewood Year 8 English</title><style>
:root{--n:#0b2f47;--t:#169aa7;--m:#657985;--g:#26764b;--r:#a8484f}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,sans-serif;overflow:hidden;background:#f5fbfb;color:#183344}.bar{height:62px;display:flex;align-items:center;gap:10px;padding:8px 18px;background:#fffdf8;border-bottom:1px solid #dce9eb;box-shadow:0 3px 16px #15384914;position:relative;z-index:10}.seal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--n),var(--t));color:#fff;font-family:Georgia,serif;font-weight:900}.who{flex:1;min-width:0;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{border:0;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.switch{background:#eef7f7;color:var(--n)}.submit{background:linear-gradient(135deg,var(--n),#0d6b78);color:#fff}.frame{width:100%;height:calc(100vh - 62px);border:0;background:#fff}.modal,.panel{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 20% 15%,#169aa738,transparent 35%),rgba(8,36,51,.78);backdrop-filter:blur(10px);z-index:100}.hidden{display:none}.card{width:min(660px,100%);background:#fffefb;border-radius:42px 18px 42px 18px;padding:clamp(25px,5vw,48px);box-shadow:0 28px 80px #0005}.ey{color:var(--t);font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:.74rem}.card h1{font:700 clamp(2.6rem,6vw,4rem)/.96 Georgia,serif;color:var(--n);margin:10px 0 18px}.card p{color:var(--m);font-size:1.05rem;line-height:1.6}.code{width:100%;height:76px;border:1px solid #cbdcdf;border-radius:20px;text-align:center;font:900 2rem ui-monospace,monospace;letter-spacing:.32em;color:var(--n);outline:none}.code:focus{border-color:var(--t);box-shadow:0 0 0 4px #169aa71a}.status{min-height:30px;text-align:center;font-weight:900;margin:8px 0}.bad{color:var(--r)}.good{color:var(--g)}.note{background:#eef8f7;border-radius:20px;padding:16px 18px;color:#38606c;line-height:1.5;margin:16px 0 20px}.go{width:100%;height:58px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--n),#0d6b78);color:#fff;font-weight:950;font-size:1.05rem;cursor:pointer}.panel{display:none;z-index:110}.panel.show{display:grid}.result{width:min(560px,100%);background:#fffefb;border-radius:34px;padding:28px;box-shadow:0 24px 70px #0004}.result h2{font:700 2rem Georgia,serif;color:var(--n);margin:0 0 10px}.result p{color:var(--m);line-height:1.55}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.actions button{border:0;border-radius:999px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:var(--n);color:#fff}.secondary{background:#edf4f4;color:var(--n)}@media(max-width:700px){.bar{height:58px;padding:7px}.frame{height:calc(100vh - 58px)}.who{font-size:.78rem}.pill{padding:9px 10px;font-size:.78rem}.card{padding:25px;border-radius:28px 14px 28px 14px}.card h1{font-size:2.7rem}}
</style></head><body>
<div class="bar"><div class="seal">M</div><div class="who" id="who">🔐 Enter student code</div><button class="pill switch" id="switch">Switch</button><button class="pill submit" id="submit">Submit to Teacher</button></div>
<iframe id="lesson" class="frame" src="unit8-1-core.html" title="Unit 8.1 lesson"></iframe>
<div class="modal" id="login"><div class="card"><div class="ey">Year 8 English • Student login</div><h1>Enter your 4-digit code</h1><p>Your code identifies your registered name and class automatically.</p><input id="code" class="code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000"><div id="status" class="status"></div><div class="note">Use only the code given to you by your teacher. Your lesson responses will be recorded under your student profile when you submit.</div><button id="go" class="go">Continue to Unit 8.1 →</button></div></div>
<div id="panel" class="panel"><div id="result" class="result"></div></div>
<script>
const URL='https://script.google.com/macros/s/AKfycbz0KfRexC2OtoWqAYwXOFbnGReN10dmyvqL-ex8d3rW0-PUFprZY77gEfVl4Lv_55Dh/exec';
const S={'4393':['Adalrico Runggul Anak Tedong','8 Daisy'],'8276':['Cayden Lai Chee Him','8 Daisy'],'6738':["Charmaine Ch'ng Ning Xuan",'8 Daisy'],'7636':['Elena Safiyya Binti Ahmad Aiman','8 Daisy'],'5457':['Eshaa Reenisha','8 Daisy'],'1627':['Ezrique Zachary Bin Dhany Azlany','8 Daisy'],'3617':['Gabriel Goh Jin Yee','8 Daisy'],'2265':['Jaden Fang Jyn Yao','8 Daisy'],'1817':['Kok Guan Fung','8 Daisy'],'3420':['Lam Chee Hin','8 Daisy'],'2699':['Lim Yong Enn','8 Daisy'],'7276':['Lim Yu Chen','8 Daisy'],'8365':['Lin Han','8 Daisy'],'7397':['Matthew Phang Hao Hin','8 Daisy'],'7848':['Osmand Loo Yu Bin','8 Daisy'],'8278':['Ruth Lee Wai Yin','8 Daisy'],'8603':['Shi Zheng Yi','8 Daisy'],'7769':['Tan Shin Tatt-Carson','8 Daisy'],'2132':['Theebhan Saravanan','8 Daisy'],'9825':['Thisen Nair A/L Vijayanair','8 Daisy'],'8510':["Welles Lee Ming X'en",'8 Daisy'],'2964':['Xan Lee-Thong','8 Daisy'],'6397':['Vyshnavi A/P Jayakumar','8 Daisy']};
const K={morocco:['He values appearance and wealth.','Appearances can be misleading.'],aragon:['He believes he deserves Portia.','People who think too highly of themselves may be foolish.'],bassanio:['He is anxious because the wrong choice could cost him Portia.','Do not judge only by outward appearance.']};
const E={a:['e1','e2'],b:['e2'],c:['e2','e5']};let P={code:'',name:'',classroom:''};
const $=id=>document.getElementById(id),lesson=$('lesson'),login=$('login'),code=$('code'),status=$('status'),who=$('who'),panel=$('panel'),result=$('result');
function save(){try{localStorage.setItem('mw_y8',JSON.stringify(P))}catch(e){}}function draw(){who.textContent=P.code?`👤 ${P.name} • ${P.classroom} • #${P.code}`:'🔐 Enter student code'}
function bgRegister(c){try{const cb='mwr'+Date.now();const x=document.createElement('script');window[cb]=()=>{delete window[cb];x.remove()};x.src=`${URL}?action=lookup&code=${c}&callback=${cb}&_=${Date.now()}`;document.body.appendChild(x);setTimeout(()=>{try{delete window[cb];x.remove()}catch(e){}},7000)}catch(e){}}
function enter(){const c=code.value.replace(/\D/g,'').slice(0,4);code.value=c;if(c.length!==4){status.className='status bad';status.textContent='Please enter all 4 digits.';return}if(!S[c]){status.className='status bad';status.textContent='Code not recognised. Please check with your teacher.';return}P={code:c,name:S[c][0],classroom:S[c][1]};save();draw();bgRegister(c);status.className='status good';status.textContent=`Welcome, ${P.name}!`;setTimeout(()=>login.classList.add('hidden'),300)}
code.oninput=()=>{code.value=code.value.replace(/\D/g,'').slice(0,4);status.textContent=''};code.onkeydown=e=>{if(e.key==='Enter')enter()};$('go').onclick=enter;$('switch').onclick=()=>{login.classList.remove('hidden');code.focus();code.select()};
try{const q=JSON.parse(localStorage.getItem('mw_y8')||'{}');if(q.code&&S[q.code]){P={code:q.code,name:S[q.code][0],classroom:S[q.code][1]};login.classList.add('hidden');code.value=q.code}}catch(e){}draw();
function doc(){try{return lesson.contentDocument||lesson.contentWindow.document}catch(e){return null}}function txt(v){return String(v||'').trim()}function snapshot(){const d=doc();if(!d)return null;const cards={};d.querySelectorAll('.suitor').forEach(c=>cards[c.dataset.char]={a:txt(c.querySelector('.attitude')?.value),m:txt(c.querySelector('.moral')?.value)});const w=[...d.querySelectorAll('.writing-prompt .prompt textarea')],claim=d.querySelector('.claim.active')?.dataset.claim||'a',ev=d.querySelector('.evidence.selected');return{cards,mf:txt(w[0]?.value),bf:txt(w[1]?.value),claim,eid:ev?.dataset.e||'',et:txt(ev?.textContent),ex:txt(d.getElementById('explainBox')?.value),fi:txt(d.querySelector('.exit button.chosen')?.textContent),xp:Number(txt(d.getElementById('xp')?.textContent)||0)||0}}
function payload(s){let correct=0;const items=[];for(const k of ['morocco','aragon','bassanio']){for(const z of [['a','Character attitude / inference',K[k][0]],['m','Moral lesson / interpretation',K[k][1]]]){const r=s.cards[k]?.[z[0]]||'',ok=r===z[2];if(ok)correct++;items.push({activity:'Activity 4',itemId:k+'_'+z[0],skill:z[1],response:r,expectedAnswer:z[2],autoResult:r?(ok?'Correct':'Incorrect'):'Unanswered',attempts:1,remedialFocus:'Review the extract and connect the character’s words to the implied attitude or lesson.'})}}const eok=!!s.eid&&E[s.claim].includes(s.eid);if(eok)correct++;items.push({activity:'Activity 5',itemId:'claim_'+s.claim+'_evidence',skill:'Evidence selection / supporting a viewpoint',response:s.et,expectedAnswer:E[s.claim].join(' or '),autoResult:s.eid?(eok?'Correct':'Incorrect'):'Unanswered',attempts:1,remedialFocus:'Match each viewpoint with the most precise supporting quotation.'});for(const x of [['morocco_free_response',s.mf,'Explaining a moral lesson'],['bassanio_free_response',s.bf,'Explaining a moral lesson'],['evidence_explanation',s.ex,'Explaining evidence'],['final_interpretation',s.fi,'Interpretation']])items.push({activity:x[0]==='evidence_explanation'?'Activity 5':x[0]==='final_interpretation'?'Exit ticket':'Activity 4',itemId:x[0],skill:x[2],response:x[1],expectedAnswer:'Teacher review',autoResult:'Teacher review',attempts:1,remedialFocus:'Teacher review'});return{submissionId:'U81-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),studentCode:P.code,studentName:P.name,classroom:P.classroom,lesson:'8.1',lessonTitle:'The Merchant of Venice',xp:s.xp,autoCorrect:correct,autoTotal:7,autoPercentage:Math.round(correct/7*100)/100,activity4FirstScore:correct-(eok?1:0),activity4FirstPossible:6,answers:{moroccoAttitude:s.cards.morocco?.a||'',moroccoMoral:s.cards.morocco?.m||'',aragonAttitude:s.cards.aragon?.a||'',aragonMoral:s.cards.aragon?.m||'',bassanioAttitude:s.cards.bassanio?.a||'',bassanioMoral:s.cards.bassanio?.m||'',moroccoFreeResponse:s.mf,bassanioFreeResponse:s.bf,activity5Claim:s.claim,activity5EvidenceId:s.eid,activity5EvidenceText:s.et,activity5EvidenceCorrect:eok,activity5Explanation:s.ex,finalInterpretation:s.fi},itemResponses:items}}
$('submit').onclick=()=>{if(!P.code){login.classList.remove('hidden');return}const s=snapshot();if(!s){alert('Please wait for the lesson to finish loading.');return}result.innerHTML=`<h2>Ready to submit?</h2><p><b>${P.name}</b><br>${P.classroom} • #${P.code}</p><p>Your Unit 8.1 responses will be sent to your teacher.</p><div class="actions"><button id="send" class="primary">Send my work</button><button id="cancel" class="secondary">Cancel</button></div>`;panel.classList.add('show');$('cancel').onclick=()=>panel.classList.remove('show');$('send').onclick=async()=>{const b=$('send');b.disabled=true;b.textContent='Sending…';try{await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(s))});result.innerHTML='<h2>Submitted ✓</h2><p>Your work has been sent to your teacher.</p><div class="actions"><button id="close" class="primary">Return to lesson</button></div>';$('close').onclick=()=>panel.classList.remove('show');$('submit').disabled=true;$('submit').textContent='Submitted ✓'}catch(e){b.disabled=false;b.textContent='Send my work';alert('Submission failed. Please try again.')}}};panel.onclick=e=>{if(e.target===panel)panel.classList.remove('show')};
</script></body></html>
