<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f47">
<title>Unit 8.1 | Maplewood Year 8 English</title>
<script>
(function(){
  try{
    const p=JSON.parse(localStorage.getItem('maplewood_y8_code_profile')||'{}');
    const verified=sessionStorage.getItem('mw_hub_verified');
    if(!p.code||!p.name||!p.classroom||verified!==p.code){
      location.replace('index.html?next=unit8-1.html');
    }
  }catch(e){location.replace('index.html?next=unit8-1.html')}
})();
</script>
<style>
:root{--n:#0b2f47;--t:#169aa7;--m:#657985;--g:#26764b;--r:#a8484f;--line:#dce9eb}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;background:#f5fbfb;color:#183344}
.bar{height:62px;display:flex;align-items:center;gap:10px;padding:8px 18px;background:#fffdf8;border-bottom:1px solid var(--line);box-shadow:0 3px 16px #15384914;position:relative;z-index:70}
.seal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--n),var(--t));color:#fff;font-family:Georgia,serif;font-weight:900;flex:0 0 auto}
.who{flex:1;min-width:0;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{border:0;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer;min-height:42px;touch-action:manipulation}.switch{background:#eef7f7;color:var(--n)}.submit{background:linear-gradient(135deg,var(--n),#0d6b78);color:#fff}
.frame{width:100%;height:calc(100vh - 62px);height:calc(100dvh - 62px);border:0;background:#fff;display:block}
.panel{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:radial-gradient(circle at 20% 15%,#169aa738,transparent 35%),rgba(8,36,51,.78);backdrop-filter:blur(10px);z-index:110}.panel.show{display:grid}.result{width:min(560px,100%);background:#fffefb;border-radius:34px;padding:28px;box-shadow:0 24px 70px #0004}.result h2{font:700 2rem Georgia,serif;color:var(--n);margin:0 0 10px}.result p{color:var(--m);line-height:1.55}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.actions button{border:0;border-radius:999px;padding:12px 16px;min-height:46px;font-weight:900;cursor:pointer}.primary{background:var(--n);color:#fff}.secondary{background:#edf4f4;color:var(--n)}
@media(max-width:700px){
  .bar{height:58px;padding:7px 9px;gap:7px}.frame{height:calc(100vh - 58px);height:calc(100dvh - 58px)}.seal{width:36px;height:36px}.who{font-size:.76rem}.switch{font-size:.74rem;padding:8px 10px;white-space:nowrap}
  .submit{position:fixed;left:14px;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:120;width:calc(100% - 28px);min-height:52px;font-size:.96rem;box-shadow:0 12px 30px rgba(11,47,71,.32)}
  body:has(.submit[style*="display: none"] ) .frame{height:calc(100dvh - 58px)}
  .result{padding:22px;border-radius:26px}.result h2{font-size:1.75rem}
}
@media(max-width:420px){.who{display:none}.bar{justify-content:space-between}.switch{margin-left:auto}.submit{bottom:calc(76px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="bar">
  <a href="index.html" aria-label="Return to Year 8 English Hub" style="text-decoration:none"><div class="seal">M</div></a>
  <div class="who" id="who">Loading profile…</div>
  <button class="pill switch" id="switch" type="button">Switch profile</button>
  <button class="pill submit" id="submit" type="button">Submit to Teacher</button>
</div>
<iframe id="lesson" class="frame" src="unit8-1-core.html" title="Unit 8.1 lesson"></iframe>
<div id="panel" class="panel"><div id="result" class="result"></div></div>
<script>
const URL='https://script.google.com/macros/s/AKfycbz0KfRexC2OtoWqAYwXOFbnGReN10dmyvqL-ex8d3rW0-PUFprZY77gEfVl4Lv_55Dh/exec';
const K={morocco:['He values appearance and wealth.','Appearances can be misleading.'],aragon:['He believes he deserves Portia.','People who think too highly of themselves may be foolish.'],bassanio:['He is anxious because the wrong choice could cost him Portia.','Do not judge only by outward appearance.']};
const E={a:['e1','e2'],b:['e2'],c:['e2','e5']};
const $=id=>document.getElementById(id),lesson=$('lesson'),who=$('who'),panel=$('panel'),result=$('result'),submit=$('submit');
let P={};
try{P=JSON.parse(localStorage.getItem('maplewood_y8_code_profile')||'{}')}catch(e){P={}}
const teacherMode=P.role==='teacher'||String(P.classroom||'').toLowerCase()==='teacher'||sessionStorage.getItem('mw_teacher_mode')==='true';
who.textContent=teacherMode?`👩‍🏫 Teacher mode • ${P.name||'Teacher'}`:`👤 ${P.name} • ${P.classroom} • #${P.code}`;
if(teacherMode){submit.style.display='none'}
$('switch').onclick=()=>{sessionStorage.removeItem('mw_hub_verified');sessionStorage.removeItem('mw_teacher_mode');localStorage.removeItem('maplewood_y8_code_profile');location.href='index.html'};
function doc(){try{return lesson.contentDocument||lesson.contentWindow.document}catch(e){return null}}
function txt(v){return String(v||'').trim()}
function snapshot(){const d=doc();if(!d)return null;const cards={};d.querySelectorAll('.suitor').forEach(c=>cards[c.dataset.char]={a:txt(c.querySelector('.attitude')?.value),m:txt(c.querySelector('.moral')?.value)});const w=[...d.querySelectorAll('.writing-prompt .prompt textarea')],claim=d.querySelector('.claim.active')?.dataset.claim||'a',ev=d.querySelector('.evidence.selected');return{cards,mf:txt(w[0]?.value),bf:txt(w[1]?.value),claim,eid:ev?.dataset.e||'',et:txt(ev?.textContent),ex:txt(d.getElementById('explainBox')?.value),fi:txt(d.querySelector('.exit button.chosen')?.textContent),xp:Number(txt(d.getElementById('xp')?.textContent)||0)||0}}
function payload(s){let correct=0;const items=[];for(const k of ['morocco','aragon','bassanio']){for(const z of [['a','Character attitude / inference',K[k][0]],['m','Moral lesson / interpretation',K[k][1]]]){const r=s.cards[k]?.[z[0]]||'',ok=r===z[2];if(ok)correct++;items.push({activity:'Activity 4',itemId:k+'_'+z[0],skill:z[1],response:r,expectedAnswer:z[2],autoResult:r?(ok?'Correct':'Incorrect'):'Unanswered',attempts:1,remedialFocus:'Review the extract and connect the character’s words to the implied attitude or lesson.'})}}const eok=!!s.eid&&E[s.claim].includes(s.eid);if(eok)correct++;items.push({activity:'Activity 5',itemId:'claim_'+s.claim+'_evidence',skill:'Evidence selection / supporting a viewpoint',response:s.et,expectedAnswer:E[s.claim].join(' or '),autoResult:s.eid?(eok?'Correct':'Incorrect'):'Unanswered',attempts:1,remedialFocus:'Match each viewpoint with the most precise supporting quotation.'});for(const x of [['morocco_free_response',s.mf,'Explaining a moral lesson'],['bassanio_free_response',s.bf,'Explaining a moral lesson'],['evidence_explanation',s.ex,'Explaining evidence'],['final_interpretation',s.fi,'Interpretation']])items.push({activity:x[0]==='evidence_explanation'?'Activity 5':x[0]==='final_interpretation'?'Exit ticket':'Activity 4',itemId:x[0],skill:x[2],response:x[1],expectedAnswer:'Teacher review',autoResult:'Teacher review',attempts:1,remedialFocus:'Teacher review'});return{submissionId:'U81-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),studentCode:P.code,studentName:P.name,classroom:P.classroom,lesson:'8.1',lessonTitle:'The Merchant of Venice',xp:s.xp,autoCorrect:correct,autoTotal:7,autoPercentage:Math.round(correct/7*100)/100,activity4FirstScore:correct-(eok?1:0),activity4FirstPossible:6,answers:{moroccoAttitude:s.cards.morocco?.a||'',moroccoMoral:s.cards.morocco?.m||'',aragonAttitude:s.cards.aragon?.a||'',aragonMoral:s.cards.aragon?.m||'',bassanioAttitude:s.cards.bassanio?.a||'',bassanioMoral:s.cards.bassanio?.m||'',moroccoFreeResponse:s.mf,bassanioFreeResponse:s.bf,activity5Claim:s.claim,activity5EvidenceId:s.eid,activity5EvidenceText:s.et,activity5EvidenceCorrect:eok,activity5Explanation:s.ex,finalInterpretation:s.fi},itemResponses:items}}
submit.onclick=()=>{if(teacherMode)return;const s=snapshot();if(!s){alert('Please wait for the lesson to finish loading.');return}result.innerHTML=`<h2>Ready to submit?</h2><p><b>${P.name}</b><br>${P.classroom} • #${P.code}</p><p>Your Unit 8.1 responses will be sent to your teacher.</p><div class="actions"><button id="send" class="primary">Send my work</button><button id="cancel" class="secondary">Cancel</button></div>`;panel.classList.add('show');$('cancel').onclick=()=>panel.classList.remove('show');$('send').onclick=async()=>{const b=$('send');b.disabled=true;b.textContent='Sending…';try{await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(s))});result.innerHTML='<h2>Submitted ✓</h2><p>Your work has been sent to your teacher.</p><div class="actions"><button id="close" class="primary">Return to lesson</button></div>';$('close').onclick=()=>panel.classList.remove('show');submit.disabled=true;submit.textContent='Submitted ✓'}catch(e){b.disabled=false;b.textContent='Send my work';alert('Submission failed. Please try again.')}}};
panel.onclick=e=>{if(e.target===panel)panel.classList.remove('show')};
</script>
</body>
</html>
